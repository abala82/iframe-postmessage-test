<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Credit Card Payment</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Segoe UI', sans-serif; padding: 20px; background: #f4f6f9; }
        h2 { color: #0070d2; margin-bottom: 16px; font-size: 16px; }
        .form-group { margin-bottom: 14px; }
        label { display: block; font-size: 12px; font-weight: 600; color: #444; margin-bottom: 4px; }
        input { width: 100%; padding: 8px 10px; border: 1px solid #c9c9c9; border-radius: 4px; font-size: 14px; }
        input:focus { outline: none; border-color: #0070d2; box-shadow: 0 0 0 2px rgba(0,112,210,0.2); }
        .row { display: flex; gap: 12px; }
        .row .form-group { flex: 1; }
        button { width: 100%; padding: 10px; background: #0070d2; color: white; border: none; border-radius: 4px; font-size: 14px; cursor: pointer; margin-top: 4px; }
        button:hover { background: #005fb2; }
        #status { margin-top: 12px; font-size: 12px; color: #2e7d32; font-weight: 600; display: none; }
        #error { margin-top: 8px; font-size: 12px; color: #c23934; display: none; }
    </style>
</head>
<body>
    <h2>Credit Card Details</h2>
    <form id="ccForm" onsubmit="submitForm(event)">
        <div class="form-group">
            <label for="nameOnCard">Name on Card</label>
            <input type="text" id="nameOnCard" placeholder="John Smith" autocomplete="cc-name" />
        </div>
        <div class="form-group">
            <label for="cardNumber">Card Number</label>
            <input type="text" id="cardNumber" placeholder="1234 5678 9012 3456" maxlength="19" autocomplete="cc-number" oninput="formatCardNumber(this)" />
        </div>
        <div class="row">
            <div class="form-group">
                <label for="expiry">Expiration Date</label>
                <input type="text" id="expiry" placeholder="MM/YY" maxlength="5" autocomplete="cc-exp" oninput="formatExpiry(this)" />
            </div>
            <div class="form-group">
                <label for="cvv">CVV</label>
                <input type="text" id="cvv" placeholder="123" maxlength="4" autocomplete="cc-csc" />
            </div>
        </div>
        <div id="error"></div>
        <button type="submit">Submit Payment</button>
        <div id="status">Payment details sent to Salesforce.</div>
    </form>

    <script>
        function formatCardNumber(input) {
            let v = input.value.replace(/\D/g, '').substring(0, 16);
            input.value = v.match(/.{1,4}/g)?.join(' ') || v;
        }

        function formatExpiry(input) {
            let v = input.value.replace(/\D/g, '').substring(0, 4);
            if (v.length >= 3) v = v.substring(0, 2) + '/' + v.substring(2);
            input.value = v;
        }

        function showError(msg) {
            const el = document.getElementById('error');
            el.textContent = msg;
            el.style.display = 'block';
        }

        function clearError() {
            const el = document.getElementById('error');
            el.textContent = '';
            el.style.display = 'none';
        }

        function submitForm(event) {
            event.preventDefault();
            clearError();

            const nameOnCard = document.getElementById('nameOnCard').value.trim();
            const cardNumber = document.getElementById('cardNumber').value.replace(/\s/g, '');
            const expiry = document.getElementById('expiry').value.trim();
            const cvv = document.getElementById('cvv').value.trim();

            if (!nameOnCard) return showError('Name on card is required.');
            if (cardNumber.length < 13) return showError('Enter a valid card number.');
            if (!/^\d{2}\/\d{2}$/.test(expiry)) return showError('Expiration must be MM/YY.');
            if (cvv.length < 3) return showError('Enter a valid CVV.');

            const payload = {
                type: 'cc_form_submit',
                data: {
                    nameOnCard,
                    cardNumber,
                    expiry,
                    // never send raw CVV in production — this is a spike only
                    cvv
                }
            };

            window.parent.postMessage(payload, '*');
            document.getElementById('status').style.display = 'block';
        }

        // announce loaded
        window.addEventListener('load', () => {
            window.parent.postMessage({ type: 'iframe_loaded' }, '*');
        });
    </script>
</body>
</html>
